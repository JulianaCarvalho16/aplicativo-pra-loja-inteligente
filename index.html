    <script>
      // Gracefully silence Vite dev HMR WebSocket failure notices in restricted proxy/iFrame environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = String((reason && (reason.message || reason)) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String((event && event.message) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
